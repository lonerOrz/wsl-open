name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以检查标签

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          # 提取版本号，例如 0.1.1
          VERSION=$(grep '^version =' Cargo.toml | cut -d '"' -f 2)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG is new, preparing release."
          fi

  build:
    needs: check_version
    if: needs.check_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Linux release
        run: cargo build --release
      - name: Prepare binary
        run: mv target/release/wsl-open wsl-open-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl-open-linux
          path: wsl-open-linux-x86_64

  release:
    needs: [check_version, build]
    if: needs.check_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wsl-open-linux
          path: ./

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check_version.outputs.new_version }}"
          gh release create "$TAG" wsl-open-linux-x86_64 \
            --title "$TAG" \
            --notes "WSL Open - Automatic release for $TAG" \
            --generate-notes

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag existence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists"
              exit 1
            fi
            gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG} || true
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Linux release
        run: cargo build --release
      - name: Prepare binary
        run: mv target/release/wsl-open wsl-open-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl-open-linux
          path: wsl-open-linux-x86_64

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wsl-open-linux
          path: ./
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release create "$TAG" wsl-open-linux-x86_64 --title "$TAG" --notes "WSL Open - Linux x86_64 binary"

  cleanup:
    needs: [validate, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: failure()
    steps:
      - name: Cleanup failed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG 2>/dev/null || true
